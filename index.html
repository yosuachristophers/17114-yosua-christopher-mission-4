    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>         

        <!-- Boxicon -->
        <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>

        <!-- Utilities -->
        <link rel="stylesheet" href="style.css">

        <!-- Title Of Page -->
        <title>Focus.Flow | Home</title>
    </head>
    <body>

        <!--  
        |--------------------------------------------------------------------------
        | Navigation Bar
        |--------------------------------------------------------------------------
        -->
        <div class="container mx-auto flex flex-row justify-between items-center p-4">

            <div class="flex flex-row bg-white p-2 space-x-4 items-center rounded-xl">
                <!-- User Logo -->
                <img src="/img/user.png" class="w-10" alt="">

                <!-- User Information -->
                <div class="flex flex-col">
                    <h1 style="font-family: 'Poppins', sans-serif;" class="font-black text-md">Yosua Christopher</h1>
                    <h2 style="font-family: 'Poppins', sans-serif;" class="text-md">Project Manager</h2>
                </div>
            </div>

            <!-- Setting Logo -->
            <div class="flex bg-white rounded-sm h-[60px] justify-center items-center p-4 rounded-xl">
                <i class='bxrd  bx-slider text-2xl'></i>
            </div>  
        </div>

        <!--  
        |--------------------------------------------------------------------------
        | Hero Banner
        |--------------------------------------------------------------------------
        -->
         <div class="container mx-auto flex flex-col px-4">
            <div class="flex flex-row">
                <div class="flex flex-col w-2/4 h-[270px] justify-start items-start">
                    <h1 class="font-league text-[144px] leading-none mt-[-15px]">FOC.</h1>
                    <h1 class="font-league text-[144px] leading-none mb-[-15px]">FLOW</h1>
                </div>

                <div class="flex flex-col w-2/4 justify-between">
                    <!-- Date & Time -->
                    <div class="justify-end items-end flex flex-col">
                        <h5 class="text-xs">Sunday, 16 September 2025</h5>
                        <h5 class="text-xs">19:14:20</h5>
                    </div>

                    <!-- Black Dot -->
                    <div class="flex justify-end">
                        <div class="bg-black w-[20px] h-[20px]"></div>
                    </div>

                    <!-- Logo Of Creator -->
                    <div class="flex justify-end items-end">
                        <img class="w-[160px]" src="/img/leftmythrone-logo.png" alt="">
                    </div>
                </div>
            </div>

            <div class="container mx-auto flex flex-row justify-end items-end">
                <!-- Plus -->
                <div class=" w-2/4">
                    <h1 class="font-league text-[60px] leading-none my-[-15px] font-extrabold w-2/4">+</h1>
                </div>

                <!-- Username -->
                <div class=" w-2/4 flex justify-end">
                    <h5 class="text-xs leading-none m-0">@yosuachristohers</h5>
                </div>
            </div>
         </div>

        <!--  
        |--------------------------------------------------------------------------
        | Tracking Flow Section
        |--------------------------------------------------------------------------
        -->
        <div class="container mx-auto flex flex-row mt-4">
            
            <!-- Left -->
            <div class="flex flex-col w-2/4 pl-4 pr-2 space-y-3">
                <div class="w-full h-[110px] bg-white rounded-xl p-4">
                    <div class="flex flex-row items-center space-x-2">
                        <div class="w-[20px] h-[20px] rounded-full bg-[#ff3131]"></div>
                        <h2 style="font-family: 'Poppins', sans-serif;" class="text-md">Urgent</h2>
                    </div>
                </div>
                <div class="w-full h-[110px] bg-white rounded-xl">

                </div>
            </div>

            <!-- Right -->
            <div class="flex flex-col w-2/4 pr-4 pl-2 space-y-3">
                <div class="w-full h-[110px] bg-white rounded-xl">

                </div>
                <div class="w-full h-[110px] bg-white rounded-xl">

                </div>
            </div>
        </div>
    </body>
    </html>
